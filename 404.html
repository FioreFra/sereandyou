<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sere&amp;You</title>
<script>
  (function () {
    var path = location.pathname;
    var match = path.match(/^(\/sereyou)?\/(look|post)\/([^/]+)\/?$/);
    var target = (path.indexOf('/sereyou/') === 0 ? '/sereyou/index.html' : '/index.html');
    if (match) {
      var prefix = match[1] || '';
      var page = match[2] === 'look' ? '/look.html' : '/post.html';
      target = prefix + page + '?id=' + encodeURIComponent(match[3]);
    }
    location.replace(target + location.hash);
  })();
</script>
</head>
<body>
<p>Reindirizzamento in corso… se non succede nulla, <a href="/index.html">torna alla home</a>.</p>
</body>
</html>
