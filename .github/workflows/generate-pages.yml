name: Genera pagine statiche dei look/post

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'look.html'
      - 'post.html'
      - 'sereyou/look.html'
      - 'js/sereyou-data.js'
      - 'scripts/generate-pages.js'
      - '.github/workflows/generate-pages.yml'

permissions:
  contents: write

concurrency:
  group: generate-pages
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npm run generate

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Rigenera le pagine statiche di look/post'
          file_pattern: 'look/** post/** sereyou/look/**'
